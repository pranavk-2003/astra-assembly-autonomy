# Joint limits for UR5e + Robotiq 2F-85.
#
# ur_moveit_config ships limits for the six arm joints only, because it
# describes a bare arm. MoveIt's time parameterisation needs an acceleration
# limit for EVERY joint it plans, so adding the gripper without this fails
# every gripper trajectory with:
#   "No acceleration limit was defined for joint robotiq_85_left_knuckle_joint"
#
# Arm values are copied from ur_moveit_config unchanged.

joint_limits:
  # --- UR5e arm (as upstream) ---
  shoulder_pan_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  shoulder_lift_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  elbow_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_1_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_2_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0
  wrist_3_joint:
    has_acceleration_limits: true
    max_acceleration: 5.0

  # --- Robotiq 2F-85 ---
  # The single actuated joint of the linkage. Velocity matches the URDF's own
  # limit (0.5 rad/s); the acceleration limit is conservative - the jaw travels
  # 0.8 rad end to end, so a hard stop at the object is normal and a lower
  # acceleration keeps the contact gentle.
  robotiq_85_left_knuckle_joint:
    has_velocity_limits: true
    max_velocity: 0.5
    has_acceleration_limits: true
    max_acceleration: 1.0
