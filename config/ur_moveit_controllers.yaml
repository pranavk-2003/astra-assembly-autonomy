# How MoveIt's executor reaches the controllers declared in
# ros2_controllers_ur.yaml. Mirrors the upstream Panda equivalent
# (gripper_moveit_controllers.yaml) for the UR + repo-defined gripper.
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - ur_arm_controller
    - ur_hand_controller

  ur_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

  ur_hand_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    # Without this MoveIt sends max_effort = 0 (visible in its own log as
    # "will command a max effort of: 0"), so the jaws close with no force and
    # cannot hold anything. A real gripper is commanded to squeeze against a
    # force limit and stall on the workpiece - it does not servo to a
    # position. 40 Nm at the knuckle is a firm grip well inside the joint's
    # 50 Nm limit.
    max_effort: 100.0
    joints:
      - robotiq_85_left_knuckle_joint
