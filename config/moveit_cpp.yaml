# MoveItCpp/moveit_py-specific parameters. Distinct from (and required in
# addition to) the "planning_pipelines" flat list that MoveItConfigsBuilder
# emits for the move_group node - moveit_cpp's C++ loader looks for
# "planning_pipelines.pipeline_names" under this nested key, which the
# panda_moveit_config package does not ship. Discovered via live smoke-test
# debugging (see docs/moveit2_integration_notes.md).
planning_scene_monitor_options:
  name: "planning_scene_monitor"
  robot_description: "robot_description"
  joint_state_topic: "/joint_states"
  attached_collision_object_topic: "/moveit_cpp/planning_scene_monitor"
  publish_planning_scene_topic: "/moveit_cpp/publish_planning_scene"
  monitored_planning_scene_topic: "/moveit_cpp/monitored_planning_scene"
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: ["ompl"]

plan_request_params:
  planning_attempts: 1
  planning_pipeline: ompl
  max_velocity_scaling_factor: 1.0
  max_acceleration_scaling_factor: 1.0
