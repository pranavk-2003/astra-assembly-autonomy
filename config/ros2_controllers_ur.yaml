# ros2_control controllers for the UR Gazebo demo. Mirrors
# config/ros2_controllers_gazebo.yaml (the Panda equivalent); the Panda build
# established every setting here, see docs/moveit2_integration_notes.md.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    ur_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    ur_hand_controller:
      type: position_controllers/GripperActionController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

ur_arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

ur_hand_controller:
  ros__parameters:
    # The 2F-85's single actuated joint; its five linkage joints follow
    # via URDF mimic tags.
    joint: robotiq_85_left_knuckle_joint
    # A real grasp necessarily stalls the fingers against the object; the
    # controller aborts on that by default, which fails the pick even though
    # the grasp succeeded. Established on the Panda build.
    allow_stalling: true
    # How the stall is recognised. Closing on a 45 mm part halts the jaws at
    # roughly 0.38 rad while the goal is 0.7, so the joint simply stops short -
    # that IS the grasp, and it must be reported as success rather than as a
    # goal never reached. Detect it quickly (0.3 s below a near-zero velocity)
    # so the pick does not sit waiting out a long timeout.
    # 0.001 was too strict: a position-commanded joint pressed against a part
    # keeps creeping microscopically instead of stopping dead, so the velocity
    # never fell below it, the stall was never declared, and the goal simply
    # never returned. 0.01 rad/s is still far below any real motion (the joint
    # travels at 0.5 rad/s) but comfortably above that creep.
    stall_velocity_threshold: 0.01
    stall_timeout: 0.3
    # Position tolerance for calling a free-air move complete.
    goal_tolerance: 0.01

gz_ros_control:
  ros__parameters:
    # Node name really is gz_ros_control, without the "2" (confirmed against
    # the compiled plugin). Raises how hard the position interface tracks its
    # command, which is otherwise weak against gravity.
    position_proportional_gain: 1.0
